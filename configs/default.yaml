# Gomoku Transformer — Default Configuration

model:
  d_model: 128
  n_layers: 16
  n_heads: 4
  d_ff: 256
  dropout: 0.1
  max_seq_len: 512

training:
  lr: 1.0e-3
  lr_min: 1.0e-5
  weight_decay: 0.01
  entropy_coef: 0.01
  entropy_coef_min: 0.001
  grad_clip: 1.0
  games_per_step: 32768
  page_size: 32
  base_batch: 4096
  base_seq_len: 128
  train_batch_size: 2048
  augment: false
  checkpoint_interval: 100
  eval_interval: 50
  eval_games: 400

# wandb logging (set WANDB_API_KEY env var, not here)
wandb:
  project: "gomoku-transformer"
  entity: null  # set to your wandb username
