# Ablation: scaled-up model (depth × 1.5)

model:
  d_model: 128
  n_layers: 24
  n_heads: 4
  d_ff: 384
  dropout: 0.1
  max_seq_len: 512

training:
  lr: 1.0e-3
  lr_min: 1.0e-5
  weight_decay: 0.01
  entropy_coef: 0.01
  entropy_coef_min: 0.001
  entropy_fixed: null
  reward_decay_half_life: null
  grad_clip: 1.0
  games_per_step: 32768
  page_size: 32
  base_batch: 2048
  base_seq_len: 128
  train_batch_size: 512
  augment: false
  checkpoint_interval: 10

wandb:
  project: "gomoku-transformer"
  entity: null
  name: "scale_up"
